<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
    .header { background: linear-gradient(135deg, #10b981, #0d9488); color: white; padding: 16px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.85; }
    .content { padding: 16px; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    .stat:last-child { border-bottom: none; }
    .stat-label { font-size: 13px; color: #64748b; }
    .stat-value { font-size: 15px; font-weight: 700; }
    .bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin: 8px 0 16px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .toggle label { font-size: 13px; font-weight: 600; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    input:checked + .slider { background: #10b981; }
    input:checked + .slider:before { transform: translateX(20px); }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #10b981; color: white; }
    .btn-danger { background: #e11d48; color: white; }
    .sites { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
    .chip { background: #fee2e2; color: #b91c1c; padding: 3px 8px; border-radius: 12px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FocusGuard</h1>
    <p>Smart Todo + ScreenTime Alarm</p>
  </div>
  <div class="content">
    <div class="stat">
      <span class="stat-label">Wasted Today</span>
      <span class="stat-value" id="wasted">—</span>
    </div>
    <div class="bar">
      <div class="bar-fill" id="bar" style="width: 0%; background: #10b981;"></div>
    </div>

    <div class="stat">
      <span class="stat-label">Daily Limit</span>
      <span class="stat-value" id="limit">60 min</span>
    </div>

    <div class="toggle">
      <label>Focus Mode</label>
      <label class="switch">
        <input type="checkbox" id="focus" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="stat" style="flex-direction: column; align-items: flex-start;">
      <span class="stat-label" style="margin-bottom: 6px;">Distracting Sites</span>
      <div class="sites" id="sites"></div>
    </div>

    <button class="btn btn-danger" id="block">Block for 1 Hour</button>
    <button class="btn btn-primary" id="open">Open Full App</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
